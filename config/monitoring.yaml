# TM Service Monitoring Configuration
# 管理员专属配置，控制 watchdog 和告警行为

admin:
  restart_allowed: true # 允许 watchdog 自动重启服务

  # 告警渠道（可配多个，全部发送）
  channels:
    # 飞书机器人
    - type: feishu
      webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/6302c564-9058-4e4e-8693-\
        6e360ae7a32c" # https://open.feishu.cn/open-apis/bot/v2/hook/xxx
      secret: "w7D3Y6mGzs3ReiUS0BXF0c" # 签名密钥（可选，飞书机器人设置中获取）
    # 企业微信机器人
    # - type: wecom
    #   webhook: ""              # https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx

    # 通用 Webhook（Slack/钉钉/自定义）
    # - type: webhook
    #   url: ""

health_check:
  web:
    url: "http://localhost:9111/health"
    timeout: 10
    expected_status: 200
  daemon:
    url: "http://localhost:3901/status"
    timeout: 5
    expected_status: 200

watchdog:
  enabled: true
  interval: 60
  max_failures: 3
  restart_cooldown: 60
  alert_cooldown: 300
  log_file: "/tmp/tm-watchdog.log"
  restart_web: "cd {workspace} && make web-restart"
  restart_daemon: "cd {workspace} && make daemon-stop && make daemon-install"
  workspace: "/Users/yeshouyou/Work/agent/team_doc"
