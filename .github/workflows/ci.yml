name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  doc-gardening:
    name: Doc Gardening
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Doc gardening
        run: python scripts/harness_doc_gardening.py

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Harness import check
        run: python scripts/harness_import_check.py
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
        continue-on-error: true
      - name: Secrets check (lightweight)
        run: |
          if grep -rE '(aws_secret_access_key|AKIA[0-9A-Z]{16}|password\s*=\s*["\'][^"\']{12,}["\'])' \
            --include='*.py' --include='*.yaml' --include='*.yml' src/ config.development.yaml config.production.yaml 2>/dev/null; then
            echo "::warning::Possible secret pattern found; fix or add to allowlist. Set continue-on-error to false to enforce."
            exit 1
          fi
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: team_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEAM_MEMORY_DATABASE__URL: "postgresql+asyncpg://developer:devpass@localhost:5432/team_memory"
      TEAM_MEMORY_API_KEY: "dev-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: pytest tests/ --ignore=tests/failure_tests -m "not failure_injection" -v --tb=short --timeout=60 --cov=team_memory --cov-report=xml
      - name: Web smoke (health + stats)
        run: |
          python -m team_memory.web.app >/tmp/tm-web-ci.log 2>&1 &
          WEB_PID=$!
          trap "kill $WEB_PID 2>/dev/null || true" EXIT
          for i in {1..20}; do
            curl -fsS http://localhost:9111/health >/dev/null && break
            sleep 1
          done
          if ! TEAM_MEMORY_API_KEY="$TEAM_MEMORY_API_KEY" python scripts/smoke/smoke_web_dashboard.py --api-key "$TEAM_MEMORY_API_KEY" --port 9111; then
            echo "--- /tmp/tm-web-ci.log ---"
            tail -n 60 /tmp/tm-web-ci.log || true
            exit 1
          fi
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          docker build -t team_memory:${{ github.sha }} .
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            docker tag team_memory:${{ github.sha }} team_memory:latest
          fi
          echo "Docker image built successfully"

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: team_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEAM_MEMORY_DATABASE__URL: "postgresql+asyncpg://developer:devpass@localhost:5432/team_memory"
      TEAM_MEMORY_API_KEY: "dev-key"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Start daemon
        run: make daemon-start
        env:
          TM_PIPELINE_DB_PATH: /tmp/tm-test.db

      - name: Wait for daemon
        run: bash scripts/failure-tests/ensure_daemon_ready.sh

      - name: Run acceptance regression tests
        run: make test-acceptance

      - name: Stop daemon
        run: make daemon-stop
        if: always()
