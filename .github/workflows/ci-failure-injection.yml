name: Failure Injection CI
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  failure-tests:
    name: Failure Injection Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEAM_MEMORY_DATABASE__URL: "postgresql+asyncpg://developer:devpass@localhost:5433/team_memory"
      TEAM_MEMORY_API_KEY: "dev-key"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start postgres
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U developer -d team_memory && break
            sleep 1
          done

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Start daemon
        run: make daemon-start
        env:
          TM_PIPELINE_DB_PATH: /tmp/tm-test.db

      - name: Wait for daemon
        run: bash scripts/failure-tests/ensure_daemon_ready.sh

      - name: Run failure injection tests
        run: pytest tests/failure_tests/ -v -m failure_injection --timeout=120
        env:
          TM_PIPELINE_DB_PATH: /tmp/tm-test.db

      - name: Stop daemon and containers
        run: |
          make daemon-stop
          docker compose down -v
        if: always()
