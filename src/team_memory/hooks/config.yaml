daemon:
  host: "127.0.0.1"
  port: 3901

tm:
  mode: "local"
  base_url: "http://localhost:9111"
  user: "admin"

obsidian:
  vaults:
    - path: "/Users/yeshouyou/Work/ad_learning"
      project: "ad_learning"
      exclude: [".obsidian", ".trash", ".git", "node_modules", "source", "tools", ".learning", ".codex", ".claude", ".cursor"]

projects:
  - name: "team_doc"
    path_patterns: ["team_doc"]
  - name: "ad_learning"
    path_patterns: ["ad_learning"]
  - name: "ai_learning"
    path_patterns: ["ai_learning"]
  - name: "adx_sdk_android"
    path_patterns: ["adx-sdk-android"]
  - name: "adx_sdk_ios"
    path_patterns: ["adx-sdk-ios"]
  - name: "inapp_dsp"
    path_patterns: ["inapp-dsp"]
  - name: "adx_neo"
    path_patterns: ["adx-neo"]
  - name: "inapp_adx"
    path_patterns: ["inapp-adx"]
  - name: "inapp_jump"
    path_patterns: ["inapp-jump"]
  - name: "agent_common"
    path_patterns: ["agent-common"]

retrieval:
  session_start_top_k: 3
  keyword_triggers: ["之前", "上次", "经验", "踩坑", "遇到过"]

draft:
  max_age_minutes: 30
  db_path: "~/.cache/tm-pipeline/drafts.db"

refinement:
  enabled: true
  provider: "litellm"
  model: "gbu-gemini-3.8-flash"
  fallback_model: "gbu-azure-gpt-5.6-luna"
  base_url: "https://gw.gburouter.com/v1"
  api_key_env: "GATEWAY_API_KEY"
  timeout: 30
  scan_interval_seconds: 30
  max_input_chars: 6000
  max_retries: 1
  fallback_on_failure: true

evaluation:
  faithfulness_batch_threshold: 5

arena:
  enabled: false

auto_dream:
  enabled: true
  min_hours_since_last: 24
  min_new_experiences: 5
  merge_similarity_threshold: 0.85
  prune_max_age_days: 30
  scan_interval_minutes: 60

wiki:
  enabled: true
  # 默认为空 → 使用项目根目录下的 wiki/
  # wiki_root: "/Users/yeshouyou/Work/agent/team_doc/wiki"
  # db_path: "/Users/yeshouyou/Work/agent/team_doc/.wiki/cache.db"
